name: Validate Lola Modules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  get-changed-files:
    name: Get Changed Files
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changed.outputs.files }}
      changed_modules: ${{ steps.changed.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            changed=$(git diff --name-only HEAD~1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "files=$changed" >> "$GITHUB_OUTPUT"
          echo "Changed files: $changed"

          # Extract unique modules from changed files
          modules=$(echo "$changed" | jq -r '.[]' | grep -E '^[^/]+/module/' | cut -d'/' -f1 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Changed modules: $modules"

  validate-structure:
    name: Validate Module Structure
    needs: get-changed-files
    if: needs.get-changed-files.outputs.changed_modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.get-changed-files.outputs.changed_modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required directories exist
        run: |
          module="${{ matrix.module }}"
          echo "Checking $module structure..."

          # Check module/ directory exists
          if [ ! -d "$module/module" ]; then
            echo "❌ $module/module/ directory missing"
            exit 1
          fi

          # Check required files
          for file in AGENTS.md mcps.json; do
            if [ ! -f "$module/module/$file" ]; then
              echo "❌ $module/module/$file missing"
              exit 1
            fi
          done

          # Check required subdirectories
          for dir in commands skills agents; do
            if [ ! -d "$module/module/$dir" ]; then
              echo "❌ $module/module/$dir/ directory missing"
              exit 1
            fi
          done

          echo "✅ $module structure valid"

  validate-frontmatter:
    name: Validate Frontmatter
    needs: get-changed-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate command frontmatter
        env:
          CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed_files }}
        run: |
          python3 << 'EOF'
          import yaml
          import sys
          import os
          import json
          from pathlib import Path

          changed_files = json.loads(os.environ.get('CHANGED_FILES', '[]'))
          changed_commands = [f for f in changed_files if '/module/commands/' in f and f.endswith('.md')]

          if not changed_commands:
              print("✅ No command files changed")
              sys.exit(0)

          errors = []

          for cmd_path in changed_commands:
              cmd_file = Path(cmd_path)
              if not cmd_file.exists():
                  continue

              with open(cmd_file) as f:
                  content = f.read()

              if not content.startswith('---'):
                  errors.append(f"{cmd_file}: Missing frontmatter")
                  continue

              parts = content.split('---', 2)
              if len(parts) < 3:
                  errors.append(f"{cmd_file}: Invalid frontmatter format")
                  continue

              try:
                  fm = yaml.safe_load(parts[1])
              except yaml.YAMLError as e:
                  errors.append(f"{cmd_file}: Invalid YAML - {e}")
                  continue

              if 'description' not in fm:
                  errors.append(f"{cmd_file}: Missing 'description' field")
              if 'argument-hint' not in fm:
                  errors.append(f"{cmd_file}: Missing 'argument-hint' field")

          if errors:
              print("❌ Frontmatter validation errors:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          print(f"✅ Validated {len(changed_commands)} command file(s)")
          EOF

      - name: Validate skill frontmatter
        env:
          CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed_files }}
        run: |
          python3 << 'EOF'
          import yaml
          import sys
          import os
          import json
          from pathlib import Path

          changed_files = json.loads(os.environ.get('CHANGED_FILES', '[]'))
          changed_skills = [f for f in changed_files if '/module/skills/' in f and f.endswith('SKILL.md')]

          if not changed_skills:
              print("✅ No skill files changed")
              sys.exit(0)

          errors = []

          for skill_path in changed_skills:
              skill_file = Path(skill_path)
              if not skill_file.exists():
                  continue

              with open(skill_file) as f:
                  content = f.read()

              if not content.startswith('---'):
                  errors.append(f"{skill_file}: Missing frontmatter")
                  continue

              parts = content.split('---', 2)
              if len(parts) < 3:
                  errors.append(f"{skill_file}: Invalid frontmatter format")
                  continue

              try:
                  fm = yaml.safe_load(parts[1])
              except yaml.YAMLError as e:
                  errors.append(f"{skill_file}: Invalid YAML - {e}")
                  continue

              if 'name' not in fm:
                  errors.append(f"{skill_file}: Missing 'name' field")
              if 'description' not in fm:
                  errors.append(f"{skill_file}: Missing 'description' field")

          if errors:
              print("❌ Frontmatter validation errors:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          print(f"✅ Validated {len(changed_skills)} skill file(s)")
          EOF

  validate-json:
    name: Validate JSON Files
    needs: get-changed-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mcps.json files
        env:
          CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed_files }}
        run: |
          changed_json=$(echo "$CHANGED_FILES" | jq -r '.[]' | grep 'mcps\.json$' || true)

          if [ -z "$changed_json" ]; then
            echo "✅ No mcps.json files changed"
            exit 0
          fi

          for json_file in $changed_json; do
            if [ ! -f "$json_file" ]; then
              continue
            fi
            echo "Checking $json_file..."
            if ! jq empty "$json_file" 2>/dev/null; then
              echo "❌ $json_file is not valid JSON"
              exit 1
            fi

            if ! jq -e '.mcpServers' "$json_file" >/dev/null; then
              echo "❌ $json_file missing 'mcpServers' key"
              exit 1
            fi
          done
          echo "✅ All changed JSON files valid"

  check-placeholders:
    name: Check for Placeholders
    needs: get-changed-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for placeholder text in changed files
        env:
          CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed_files }}
        run: |
          files_to_check=$(echo "$CHANGED_FILES" | jq -r '.[]' | grep -v '^template/' | grep -v '^\.github/' || true)

          if [ -z "$files_to_check" ]; then
            echo "✅ No relevant files changed"
            exit 0
          fi

          found_placeholder=false
          for file in $files_to_check; do
            if [ -f "$file" ] && grep -q '\[REPLACE:' "$file"; then
              echo "❌ Found placeholder in: $file"
              found_placeholder=true
            fi
          done

          if [ "$found_placeholder" = true ]; then
            exit 1
          fi
          echo "✅ No placeholder text found in changed files"

  validate-agents:
    name: Validate AGENTS.md
    needs: get-changed-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate AGENTS.md files
        env:
          CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed_files }}
        run: |
          python3 << 'EOF'
          import yaml
          import sys
          import os
          import json
          from pathlib import Path

          changed_files = json.loads(os.environ.get('CHANGED_FILES', '[]'))
          changed_agents = [f for f in changed_files if f.endswith('AGENTS.md')]

          if not changed_agents:
              print("✅ No AGENTS.md files changed")
              sys.exit(0)

          errors = []

          for agents_path in changed_agents:
              agents_file = Path(agents_path)
              if not agents_file.exists():
                  continue

              with open(agents_file) as f:
                  content = f.read()

              if not content.startswith('---'):
                  errors.append(f"{agents_file}: Missing frontmatter")
                  continue

              parts = content.split('---', 2)
              if len(parts) < 3:
                  errors.append(f"{agents_file}: Invalid frontmatter format")
                  continue

              try:
                  fm = yaml.safe_load(parts[1])
              except yaml.YAMLError as e:
                  errors.append(f"{agents_file}: Invalid YAML - {e}")
                  continue

              if 'name' not in fm:
                  errors.append(f"{agents_file}: Missing 'name' field")
              if 'description' not in fm:
                  errors.append(f"{agents_file}: Missing 'description' field")

              body = parts[2]
              if '## When to Use' not in body:
                  errors.append(f"{agents_file}: Missing '## When to Use' section")

          if errors:
              print("❌ AGENTS.md validation errors:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          print(f"✅ Validated {len(changed_agents)} AGENTS.md file(s)")
          EOF
